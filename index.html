<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>舅舅的婚礼 · 全天 vlog</title>
  <meta name="description" content="舅舅结婚当天的全天 vlog：从清晨的准备，到庄严的仪式，再到夜晚的欢聚。" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5.2.8/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/newsreader@5.2.10/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.2.10/index.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.2.8/index.css" rel="stylesheet">
  <link rel="stylesheet" href="1.css">
</head>
<body>

  <header class="topnav">
    <div class="container topnav-inner">
      <a class="logo" href="#top">舅舅的婚礼</a>
      <nav>
        <a href="#film">影片</a>
      </nav>
    </div>
  </header>

  <main id="top">

    <section class="hero">
      <div class="container hero-inner">
        <p class="eyebrow">婚礼纪念 · 全天记录</p>
        <h1>舅舅的婚礼。</h1>
        <p class="lead">记录结婚这一天的每一刻——从清晨的准备，到庄严的仪式，再到夜晚的欢聚。愿这份影像，把当天的欢喜长久地留下来。</p>
        <div class="hero-meta">
          <span class="meta">结婚当天</span>
          <span class="dot" aria-hidden="true"></span>
          <span class="meta">全天 vlog</span>
        </div>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#film">观看影片</a>
        </div>
      </div>
    </section>

    <section class="section" id="film">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">影片</p>
          <h2>结婚当天 · 全天 vlog</h2>
          <p class="section-sub">从清晨到夜晚，一整天都在这里。</p>
        </div>
        <div class="video-frame">
          <div class="video-stage">
            <video class="vlog-player" controls preload="metadata" playsinline>
              <source src="wedding-vlog.mp4" type="video/mp4">
              你的浏览器不支持 HTML5 视频播放。
            </video>
            <div class="video-veil" aria-hidden="true">
              <span class="veil-play">▶</span>
              <span class="veil-text">影片即将上线</span>
            </div>
          </div>
        </div>
        <p class="video-note">把视频地址接入后，这里即可直接在线观看。上方为播放器位置，替换为真实影片即可。</p>
      </div>
    </section>

    <section class="closing">
      <div class="container">
        <p class="closing-line">愿这一刻的欢喜，长长久久。</p>
      </div>
    </section>

  </main>

  <footer class="pagefoot">
    <div class="container row-between">
      <span>舅舅的婚礼 · 全天 vlog</span>
      <span class="meta">记录于结婚当天</span>
    </div>
  </footer>

</body>
</html>
